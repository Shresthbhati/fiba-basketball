# Whole stack in containers:  POSTGRES_PASSWORD=choose-one docker compose -f docker-compose.full.yml up --build
# Web on http://localhost:3000, API on :3001, outgoing email viewable at http://localhost:8025 (Mailpit).
# NODE_ENV=production on purpose: the API refuses to start unless the production settings below are complete.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: courtiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: courtiq
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U courtiq"], interval: 5s, retries: 12 }

  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025"]

  api:
    build: { context: ., dockerfile: services/api/Dockerfile }
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgres://courtiq:${POSTGRES_PASSWORD}@postgres:5432/courtiq
      ALLOWED_ORIGINS: ${WEB_ORIGIN:-http://localhost:3000}
      WEB_BASE_URL: ${WEB_ORIGIN:-http://localhost:3000}
      SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
      MAIL_FROM: ${MAIL_FROM:-COURT IQ <no-reply@localhost>}
    ports: ["3001:3001"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: { API_URL: "http://api:3001" }
    depends_on: { api: { condition: service_healthy } }
    ports: ["3000:3000"]

volumes:
  pgdata:
