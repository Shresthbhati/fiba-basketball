<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline | COURT IQ</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#f97316" />
  <style>
    :root {
      --bg: #0b0f19;
      --card: #131b2e;
      --border: #232f48;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #f97316;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: 480px;
      width: 100%;
      padding: 2rem;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }
    .icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.5rem;
    }
    p {
      color: var(--muted);
      line-height: 1.5;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }
    .badge {
      display: inline-block;
      background: rgba(249, 115, 22, 0.15);
      color: var(--accent);
      border: 1px solid rgba(249, 115, 22, 0.3);
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    .actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
    }
    button, a {
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 0.65rem 1.25rem;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover, a:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="card" role="alert" aria-live="assertive">
    <div class="icon" aria-hidden="true">🏀⚡</div>
    <div class="badge">Offline Mode</div>
    <h1>You're Disconnected</h1>
    <p>
      COURT IQ is running offline. Active scorekeeping and workout sessions remain safely stored locally on this device and will sync automatically when your connection is restored.
    </p>
    <div class="actions">
      <button onclick="window.location.reload()">Retry Connection</button>
      <a href="/score">Scorebook</a>
    </div>
  </div>
</body>
</html>
