services:
  postgres:
    image: postgis/postgis:16-3.4
    environment: { POSTGRES_USER: courtiq, POSTGRES_PASSWORD: courtiq, POSTGRES_DB: courtiq }
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U courtiq"], interval: 5s, retries: 10 }
  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: courtiq, MINIO_ROOT_PASSWORD: courtiq-dev-only }
    ports: ["9000:9000", "9001:9001"]
  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]
